name: 'Unittests'

on:
    workflow_dispatch:
    pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
    tests:
        runs-on: "ubuntu-latest"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: Setup dependencies.
              run: |
                  python -m pip install --upgrade pip
                  pip install ".[dev,plotting]"

            - name: Running tests
              run: pytest
